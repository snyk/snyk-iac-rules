# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
version: 2

project_name: snyk-iac-rules

before:
  # run this here to avoid "git is currently in a dirty state" error
  hooks:
    - go mod tidy
    - go install github.com/google/go-licenses@latest
    - go-licenses save . --save_path=./acknowledgements
    - tar -cvf ./acknowledgements.tar.gz -C ./acknowledgements .
    - rm -rf ./acknowledgements

builds:
  - main: ./main.go
    env:
    - CGO_ENABLED=0
    goos:
    - windows
    - linux
    - darwin
    goarch:
    - amd64
    - arm64
    ldflags:
    - '-s -w -X github.com/snyk/snyk-iac-rules/cmd.version={{.Version}}'

archives:
  - id: default
    files:
      - none*
    name_template: >-
      {{- .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}Darwin_
      {{- else if eq .Os "linux" }}Linux_
      {{- else if eq .Os "windows" }}Windows_
      {{- else }}{{ .Os }}_{{ end }}
      {{- if eq .Arch "386" }}i386
      {{- else if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    formats: [ tar.gz ]
    format_overrides:
    - goos: windows
      formats: [ zip ]

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
    - '^docs:'
    - '^test:'
    - '^chore:'
    - '^refactor:'
    - '^Merge pull request'

snapshot:
  version_template: "{{ .Version }}"

release:
  # If set to true, will not auto-publish the release.
  draft: false

  # Header template for the release body.
  # Defaults to empty.
  header: |
    ## snyk-iac-rules ({{ .Date }})

    Welcome to this new release!

  # Footer template for the release body.
  # Defaults to empty.
  footer: |
    ## Thanks!

    Those were the changes on {{ .Tag }}!

  extra_files:
    - glob: ./acknowledgements.tar.gz

homebrew_casks:
  -
    # If set to auto, the release will not be uploaded to the homebrew tap
    # in case there is an indicator for prerelease in the tag e.g. v1.0.0-rc1
    # Default is false.
    skip_upload: false
    # GitHub repository to push the cask to
    repository:
      owner: snyk
      name: homebrew-tap
      token: "{{ .Env.SNYK_ACCESS_TOKEN }}"

    # Casks must live in the Casks directory.
    directory: Casks
    commit_author:
      name: snyk
      email: cloud-dev-ex@users.noreply.github.com
    homepage: "https://snyk.io/"
    description: "Write, debug, test, and bundle custom rules for Snyk Infrastructure as Code."
    binaries:
      - snyk-iac-rules
    # The binaries are not signed/notarized, so strip the macOS quarantine
    # attribute on install to avoid Gatekeeper blocking them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/snyk-iac-rules"]
          end

scoops:
  -
    # If set to auto, the release will not be uploaded to the scoop bucket
    # in case there is an indicator for prerelease in the tag e.g. v1.0.0-rc1
    # Default is false.
    skip_upload: false

    # Repository to push the app manifest to.
    repository:
      owner: snyk
      name: scoop-snyk
      token: "{{ .Env.SNYK_ACCESS_TOKEN }}"

    commit_author:
      name: snyk
      email: cloud-dev-ex@users.noreply.github.com
    homepage: "https://snyk.io/"
    license: Apache-2.0
    description: "Write, debug, test, and bundle custom rules for Snyk Infrastructure as Code."

# Publishes the deb and rpm files to the GitHub releases page.
nfpms:
  - bindir: /usr/bin
    description: "Write, debug, test, and bundle custom rules for Snyk Infrastructure as Code."
    formats:
      - deb
      - rpm
    homepage: https://github.com/snyk/snyk-iac-rules
    license: Apache-2.0
    maintainer: 'Snyk'

dockers_v2:
  -
    id: dockerimg
    images:
    - "snyk/{{ .ProjectName }}"
    tags:
    - "latest"
    - "{{ .Version }}"

announce:
  twitter:
    enabled: false
  slack:
    enabled: false
  reddit:
    enabled: false
